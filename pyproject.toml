[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metolabs-satcfdi-bridge"
version = "0.1.0"
description = "Stable, machine-friendly CLI bridge for python-satcfdi"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "MetoLabs" }
]

keywords = [
  "sat",
  "cfdi",
  "mexico",
  "fiel",
  "efirma",
  "cli",
  "bridge",
]

dependencies = [
  "satcfdi>=26.7.4,<27",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/MetoLabs/satcfdi-bridge"
Repository = "https://github.com/MetoLabs/satcfdi-bridge"
Issues = "https://github.com/MetoLabs/satcfdi-bridge/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
satcfdi-bridge = "satcfdi_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]